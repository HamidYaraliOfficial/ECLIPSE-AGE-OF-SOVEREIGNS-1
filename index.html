<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ECLIPSE: Age of Sovereigns</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
:root{--bg:#070b14;--panel:#0e1626cc;--line:#26354f;--ink:#dfe8f5;--dim:#8a9bb5;--gold:#e8b04a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,sans-serif;overflow:hidden}
canvas{display:block}body::after{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,#000b 100%)}.p{position:fixed;background:var(--panel);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:10px;padding:12px}
#top{top:10px;left:10px;right:10px;display:flex;gap:18px;flex-wrap:wrap;align-items:center}#top b{color:var(--gold);font:600 17px Georgia,serif;margin-right:8px}
#top span{color:var(--dim)}#top em{font-style:normal;color:var(--ink)}
#left{left:10px;top:70px;width:260px;max-height:calc(100vh - 90px);overflow:auto}#right{right:10px;top:70px;width:290px;max-height:calc(100vh - 90px);overflow:auto}
h3{margin:12px 0 6px;font:600 14px Georgia,serif;color:var(--gold)}h3:first-child{margin-top:0}
button{background:#17233a;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 9px;margin:2px 2px 2px 0;cursor:pointer;font:inherit}
button:hover:not(:disabled){border-color:var(--gold)}button:focus-visible{outline:2px solid var(--gold)}button:disabled{opacity:.4;cursor:not-allowed}
.go{background:var(--gold);color:#1a1205;font-weight:600;width:100%;padding:8px}
#log{color:var(--dim);font-size:12px;max-height:130px;overflow:auto}#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);padding:8px 16px;display:none}
.bar{height:6px;background:#17233a;border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
@media(max-width:800px){#left,#right{position:static;width:auto;max-height:none}body{overflow:auto}}
</style></head><body>
<div id="top" class="p"></div><div id="left" class="p"></div><div id="right" class="p"></div><div id="toast" class="p"></div>
<script type="module" src="src/main.js"></script></body></html>
